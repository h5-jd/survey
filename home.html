<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1989fa">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="珠海聚达建筑工程有限公司员工端勘察工具 v4.0">
  <title>聚达勘察助手</title>
  
  <!-- 强制注销旧Service Worker，清除缓存 -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        regs.forEach(function(reg) { reg.unregister(); });
      });
    }
    // 清理旧缓存
    if ('caches' in window) {
      caches.keys().then(function(names) {
        names.forEach(function(name) { caches.delete(name); });
      });
    }
  </script>
  
  <!-- 先加载Store（不依赖任何CDN） -->
  <script src="./js/store.js?v=20260603b"></script>
  <script>
    if (window.Store) Store.initDefaultAdmin();
  </script>
  
  <!-- 登录页样式（纯内联，零CDN依赖） -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif; }
    
    /* 登录界面 */
    .login-screen {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 99999;
      background: linear-gradient(135deg, #1989fa 0%, #096dd9 100%);
      display: flex; flex-direction: column; padding: 20px;
      transition: opacity 0.3s;
    }
    .login-screen.hiding {
      opacity: 0; pointer-events: none;
    }
    .login-header { text-align: center; padding: 50px 0 30px; }
    .login-logo {
      width: 72px; height: 72px; margin: 0 auto 14px; background: #fff;
      border-radius: 16px; display: flex; align-items: center; justify-content: center;
      font-size: 40px; font-weight: bold; color: #1989fa;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }
    .login-title { font-size: 26px; font-weight: 700; color: #fff; margin-bottom: 6px; }
    .login-subtitle { font-size: 13px; color: rgba(255,255,255,0.8); }
    .login-card {
      background: #fff; border-radius: 14px; padding: 22px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15); flex: 1;
    }
    .login-form-group { margin-bottom: 18px; }
    .login-label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; }
    .login-input {
      width: 100%; padding: 13px 14px; border: 1px solid #ebedf0; border-radius: 10px;
      font-size: 16px; background: #fff; outline: none; -webkit-appearance: none;
    }
    .login-input:focus { border-color: #1989fa; }
    .login-btn {
      width: 100%; padding: 15px; background: linear-gradient(135deg, #1989fa 0%, #096dd9 100%);
      color: #fff; border: none; border-radius: 10px; font-size: 17px; font-weight: 600;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .login-btn:active { opacity: 0.85; }
    .login-tips { font-size: 12px; color: #999; text-align: center; margin-top: 18px; line-height: 1.8; }
    .login-admin-hint {
      background: #e6f7ff; border: 1px solid #91d5ff; border-radius: 8px;
      padding: 10px; margin-bottom: 14px; text-align: center; font-size: 13px; color: #1890ff;
    }
    #loginMsg {
      margin-top: 10px; padding: 10px; border-radius: 8px; text-align: center;
      font-size: 14px; display: none;
    }
    #loginMsg.success { display: block; background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; }
    #loginMsg.error { display: block; background: #fff2f0; color: #ff4d4f; border: 1px solid #ffccc7; }
    
    /* Vue应用容器 - 登录前隐藏 */
    #app { display: none; }
  </style>
</head>
<body>
  <!-- ====== 登录界面（纯原生，零CDN依赖） ====== -->
  <div class="login-screen" id="loginScreen">
    <div class="login-header">
      <div class="login-logo">聚</div>
      <div class="login-title">聚达勘察助手</div>
      <div class="login-subtitle">标准化施工质检管理系统</div>
    </div>
    <div class="login-card">
      <div class="login-form-group">
        <label class="login-label">手机号</label>
        <input type="tel" class="login-input" id="inputPhone" placeholder="请输入手机号" maxlength="11" autocomplete="tel">
      </div>
      <div id="passwordSection" style="display:none;">
        <div class="login-form-group">
          <label class="login-label">密码</label>
          <input type="password" class="login-input" id="inputPassword" placeholder="请输入密码" maxlength="4" autocomplete="current-password">
        </div>
        <div class="login-admin-hint">👔 管理员登录，请输入密码</div>
      </div>
      <div id="loginMsg"></div>
      <button class="login-btn" id="btnLogin" type="button">登 录</button>
      <div class="login-tips">
        <p>👔 管理员：13800138000 / 密码：1234</p>
        <p>📱 员工账号由管理员创建，无需密码</p>
      </div>
    </div>
  </div>

  <!-- ====== Vue主应用容器 ====== -->
  <div id="app">
    <!-- Vue模板在app.js中定义 -->
  </div>

  <!-- Vue 3 -->
  <script src="https://cdn.bootcdn.net/ajax/libs/vue/3.4.27/vue.global.prod.min.js?v=20260603b"></script>
  
  <!-- Vant 4 -->
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/vant/4.8.4/index.min.css?v=20260603b">
  <script src="https://cdn.bootcdn.net/ajax/libs/vant/4.8.4/vant.min.js?v=20260603b"></script>
  
  <!-- 样式 -->
  <link rel="stylesheet" href="./css/app.css?v=20260603b">

  <!-- 核心脚本 -->
  <script src="./js/sop.js?v=20260603b"></script>
  <script src="./js/craft-templates.js?v=20260603b"></script>
  <script src="./js/coze-api.js?v=20260603b"></script>
  <script src="./js/watermark-camera.js?v=20260603b"></script>
  <script src="./js/photo-manager.js?v=20260603b"></script>
  
  <!-- v4.0 新增模块 -->
  <script src="./js/offline-sync.js?v=20260603b"></script>
  <script src="./js/voice-note.js?v=20260603b"></script>
  <script src="./js/video-camera.js?v=20260603b"></script>
  <script src="./js/anomaly-report.js?v=20260603b"></script>
  <script src="./js/notification.js?v=20260603b"></script>
  <script src="./js/signature.js?v=20260603b"></script>
  <script src="./js/faq-search.js?v=20260603b"></script>
  <script src="./js/report-export.js?v=20260603b"></script>
  
  <!-- 主应用 -->
  <script src="./js/app.js?v=20260603b"></script>

  <!-- ====== 登录逻辑（纯原生，零CDN依赖） ====== -->
  <script>
    (function() {
      var loginScreen = document.getElementById('loginScreen');
      var appDiv = document.getElementById('app');
      var isAdminLogin = false;
      var loginChecked = false;
      
      // 检查是否已登录 - 如果已登录，直接隐藏登录界面，显示主应用
      function checkExistingLogin() {
        if (!window.Store) return false;
        var user = Store.getCurrentUser();
        if (user) {
          hideLoginShowApp();
          return true;
        }
        return false;
      }
      
      // 隐藏登录界面，显示主应用
      function hideLoginShowApp() {
        loginScreen.classList.add('hiding');
        setTimeout(function() {
          loginScreen.style.display = 'none';
        }, 300);
        appDiv.style.display = 'block';
        // 设置全局标记，Vue app.js加载后会检测这个标记
        window.__loginDone = true;
        // 如果Vue已经挂载，立即刷新状态
        if (window.__vueApp && window.__vueApp.refreshLoginState) {
          window.__vueApp.refreshLoginState();
        }
      }
      
      // 页面加载时检查
      checkExistingLogin();
      
      // 手机号输入 - 检测是否管理员
      document.getElementById('inputPhone').addEventListener('input', function() {
        var phone = this.value;
        isAdminLogin = false;
        document.getElementById('passwordSection').style.display = 'none';
        document.getElementById('loginMsg').style.display = 'none';
        
        if (phone.length === 11 && window.Store) {
          var check = Store.checkEmployeeExists(phone);
          if (check.isAdmin) {
            isAdminLogin = true;
            document.getElementById('passwordSection').style.display = 'block';
          }
        }
      });
      
      // 登录按钮点击
      document.getElementById('btnLogin').addEventListener('click', function() {
        doLogin();
      });
      
      // 回车登录
      document.getElementById('inputPassword').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') doLogin();
      });
      document.getElementById('inputPhone').addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !isAdminLogin) doLogin();
      });
      
      function doLogin() {
        if (!window.Store) {
          showMsg('系统加载中，请稍候重试', 'error');
          return;
        }
        
        var phone = document.getElementById('inputPhone').value.trim();
        var password = document.getElementById('inputPassword').value.trim();
        
        if (!phone || phone.length !== 11) {
          showMsg('请输入正确的11位手机号', 'error');
          return;
        }
        if (isAdminLogin && !password) {
          showMsg('管理员请输入密码', 'error');
          return;
        }
        
        try {
          var result;
          if (isAdminLogin) {
            // 管理员登录
            result = Store.login(phone, password);
          } else {
            // 员工免密登录
            var users = Store.getUsers();
            var emp = null;
            for (var i = 0; i < users.length; i++) {
              if (users[i].employeeId === phone && users[i].role !== 'admin') {
                emp = users[i];
                break;
              }
            }
            if (emp) {
              result = Store.login(emp.id, '');
            } else {
              showMsg('账号不存在，请联系管理员', 'error');
              return;
            }
          }
          
          if (result && result.success) {
            showMsg('登录成功！', 'success');
            // 延迟一点隐藏，让用户看到成功提示
            setTimeout(function() {
              hideLoginShowApp();
            }, 500);
          } else {
            showMsg((result && result.message) || '登录失败', 'error');
          }
        } catch(e) {
          showMsg('登录出错：' + e.message, 'error');
        }
      }
      
      function showMsg(text, type) {
        var el = document.getElementById('loginMsg');
        el.textContent = text;
        el.className = type;
      }
    })();
  </script>
</body>
</html>
