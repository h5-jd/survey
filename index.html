<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1989fa">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="珠海聚达建筑工程有限公司员工端勘察工具 v4.0">
  <title>聚达勘察助手</title>
  
  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  
  <!-- Styles -->
  <link rel="stylesheet" href="./css/app.css">
  
  <!-- Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  
  <!-- Vant 4 -->
  <link rel="stylesheet" href="https://fastly.jsdelivr.net/npm/vant@4/lib/index.css">
  <script src="https://fastly.jsdelivr.net/npm/vant@4/lib/vant.min.js"></script>
</head>
<body>
  <div id="app">
    <!-- 页面内容由Vue渲染 -->
  </div>

  <!-- 核心脚本 -->
  <script src="./js/store.js"></script>
  <script src="./js/sop.js"></script>
  <script src="./js/craft-templates.js"></script>
  <script src="./js/coze-api.js"></script>
  <script src="./js/watermark-camera.js"></script>
  <script src="./js/photo-manager.js"></script>
  
  <!-- v4.0 新增模块 -->
  <script src="./js/offline-sync.js"></script>
  <script src="./js/voice-note.js"></script>
  <script src="./js/video-camera.js"></script>
  <script src="./js/anomaly-report.js"></script>
  <script src="./js/notification.js"></script>
  <script src="./js/signature.js"></script>
  <script src="./js/faq-search.js"></script>
  <script src="./js/report-export.js"></script>
  
  <!-- 主应用 -->
  <script src="./js/app.js"></script>

  <!-- Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(registration => {
            console.log('SW registered:', registration.scope);
          })
          .catch(error => {
            console.log('SW registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
