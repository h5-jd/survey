<!-- 
  施工步骤组件 - 升级版
  显示标准化的施工工艺步骤，支持质量标准和必拍照片审核
  每一张照片就是一道质检关卡
-->
<template>
  <div class="craft-steps-component">
    <!-- 进度概览 -->
    <div class="progress-overview" v-if="showProgress">
      <div class="progress-bar">
        <div class="progress-bar-fill" :style="{ width: progressPercent + '%' }"></div>
      </div>
      <div class="progress-text">
        <span class="current-step">第 {{ completedCount }} / {{ steps.length }} 步</span>
        <span class="percent">{{ progressPercent }}%</span>
      </div>
    </div>
    
    <!-- 步骤列表 -->
    <div class="steps-list">
      <div 
        v-for="(step, index) in steps" 
        :key="index"
        :class="[
          'craft-step', 
          { 
            'active': activeIndex === index,
            'completed': step.completed && step.reviewStatus === 'approved',
            'rejected': step.reviewStatus === 'rejected',
            'disabled': !isStepAccessible(index)
          }
        ]"
      >
        <!-- 步骤头部 -->
        <div class="step-header" @click="toggleStep(index)">
          <div class="step-status">
            <span v-if="step.reviewStatus === 'approved'" class="status-icon approved">✓</span>
            <span v-else-if="step.reviewStatus === 'rejected'" class="status-icon rejected">!</span>
            <span v-else-if="activeIndex === index" class="status-icon active">{{ index + 1 }}</span>
            <span v-else-if="step.completed" class="status-icon waiting">⏳</span>
            <span v-else class="status-icon">{{ index + 1 }}</span>
          </div>
          
          <div class="step-info">
            <div class="step-name">
              {{ index + 1 }}. {{ step.stepName || step.name }}
              <span v-if="step.reviewStatus === 'approved'" class="review-badge approved">✅审核通过</span>
              <span v-if="step.reviewStatus === 'rejected'" class="review-badge rejected">❌需返工</span>
              <span v-if="step.completed && step.reviewStatus === 'pending'" class="review-badge pending">⏳待审核</span>
            </div>
            <div class="step-meta">
              <span v-if="step.duration" class="step-duration">⏱️ {{ step.duration }}</span>
              <span v-if="step.operatorName" class="step-operator">👤 {{ step.operatorName }}</span>
              <span v-if="step.completedTime" class="step-time">{{ formatTime(step.completedTime) }}</span>
            </div>
          </div>
          
          <div class="step-arrow">{{ activeIndex === index ? '▼' : '▶' }}</div>
        </div>
        
        <!-- 步骤详情 -->
        <div v-if="activeIndex === index" class="step-content">
          <!-- 质量标准 -->
          <div class="quality-standard-section">
            <div class="section-title">📋 质量标准</div>
            <div class="quality-standard-text">{{ step.qualityStandard }}</div>
          </div>
          
          <!-- 验收要求 -->
          <div class="acceptance-criteria-section">
            <div class="section-title">✅ 验收要求</div>
            <div class="acceptance-criteria-text">{{ step.acceptanceCriteria }}</div>
          </div>
          
          <!-- 必拍照片 -->
          <div class="required-photos-section">
            <div class="section-title">
              📷 必拍照片
              <span class="photo-count">{{ getUploadedCount(index) }}/{{ step.requiredPhotos?.length || 0 }}</span>
            </div>
            <div class="required-photos-grid">
              <div 
                v-for="(photoReq, photoIndex) in step.requiredPhotos" 
                :key="photoIndex"
                :class="['required-photo-item', { uploaded: isPhotoUploaded(index, photoIndex) }]"
              >
                <div class="photo-slot" @click="takePhoto(index, photoIndex)">
                  <div v-if="isPhotoUploaded(index, photoIndex)" class="photo-preview">
                    <img :src="getPhotoUrl(index, photoIndex)" alt="照片">
                    <span class="photo-badge">{{ photoReq.name }}</span>
                  </div>
                  <div v-else class="photo-placeholder">
                    <span class="photo-icon">📷</span>
                    <span class="photo-label">{{ photoReq.name }}</span>
                    <span class="photo-desc">{{ photoReq.desc }}</span>
                  </div>
                </div>
                <div v-if="isPhotoUploaded(index, photoIndex)" class="photo-actions">
                  <button class="btn-view" @click.stop="viewPhoto(index, photoIndex)">查看</button>
                  <button class="btn-retake" @click.stop="takePhoto(index, photoIndex)">重拍</button>
                </div>
                <div v-else class="photo-required-tag">必须</div>
              </div>
            </div>
          </div>
          
          <!-- 施工要点 -->
          <div v-if="step.keyPoints && step.keyPoints.length > 0" class="step-section">
            <div class="section-title">🔑 施工要点</div>
            <div class="key-points-list">
              <div v-for="(point, pIdx) in step.keyPoints" :key="pIdx" class="key-point-item">
                <span class="key-point-icon">•</span>
                <span class="key-point-text">{{ point }}</span>
              </div>
            </div>
          </div>
          
          <!-- 审核信息 -->
          <div v-if="step.reviewNote" class="review-note-section">
            <div class="section-title">📌 审核意见</div>
            <div class="review-note-content" :class="step.reviewStatus">{{ step.reviewNote }}</div>
          </div>
          
          <!-- 操作按钮 -->
          <div class="step-actions">
            <button v-if="!step.completed" class="btn-take-photo" @click="takeNextPhoto(index)">
              📷 拍照上传
            </button>
            <button 
              v-if="!step.completed"
              class="btn-complete"
              @click="completeStep(index)"
              :disabled="!canCompleteStep(index)"
            >
              {{ canCompleteStep(index) ? '✓ 完成此步' : '请先上传所有必拍照片' }}
            </button>
            <div v-if="step.completed && step.reviewStatus === 'pending'" class="waiting-review">⏳ 等待老板审核...</div>
            <div v-if="step.completed && step.reviewStatus === 'rejected'" class="rejected-info">
              <div class="rejected-text">❌ 审核打回，需返工</div>
              <button class="btn-rework" @click="startRework(index)">开始返工</button>
            </div>
            <div v-if="step.completed && step.reviewStatus === 'approved'" class="completed-info">✅ 审核通过</div>
          </div>
        </div>
      </div>
    </div>
    
    <!-- 照片查看弹窗 -->
    <div v-if="showPhotoViewer" class="photo-viewer-overlay" @click="closePhotoViewer">
      <div class="photo-viewer-content" @click.stop>
        <img :src="viewerPhotoUrl" alt="照片">
        <div class="photo-viewer-info">{{ viewerPhotoName }}</div>
        <button class="photo-viewer-close" @click="closePhotoViewer">×</button>
      </div>
    </div>
  </div>
</template>

<script>
export default {
  name: 'CraftSteps',
  props: {
    steps: { type: Array, required: true },
    projectId: { type: String, required: true },
    showProgress: { type: Boolean, default: true }
  },
  emits: ['complete', 'photo-add', 'notes-update', 'rework'],
  setup(props, { emit }) {
    const activeIndex = ref(0);
    const showPhotoViewer = ref(false);
    const viewerPhotoUrl = ref('');
    const viewerPhotoName = ref('');
    
    const completedCount = computed(() => props.steps.filter(s => s.completed && s.reviewStatus === 'approved').length);
    const progressPercent = computed(() => props.steps.length === 0 ? 0 : Math.round((completedCount.value / props.steps.length) * 100));
    
    const isStepAccessible = (index) => {
      if (index === 0) return true;
      return props.steps[index - 1]?.reviewStatus === 'approved';
    };
    
    const canCompleteStep = (index) => {
      const step = props.steps[index];
      return (step.photos || []).length >= (step.requiredPhotos || []).length;
    };
    
    const getUploadedCount = (stepIndex) => (props.steps[stepIndex].photos || []).length;
    const isPhotoUploaded = (stepIndex, photoIndex) => (props.steps[stepIndex].photos || [])[photoIndex] !== undefined;
    const getPhotoUrl = (stepIndex, photoIndex) => (props.steps[stepIndex].photos || [])[photoIndex]?.url || '';
    
    const toggleStep = (index) => {
      if (!isStepAccessible(index) && activeIndex.value !== index) return;
      activeIndex.value = activeIndex.value === index ? -1 : index;
    };
    
    const takePhoto = (stepIndex, photoIndex) => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.capture = 'environment';
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          emit('photo-add', {
            projectId: props.projectId, stepIndex, photoIndex,
            photo: { id: Date.now().toString(), url: event.target.result, name: props.steps[stepIndex].requiredPhotos?.[photoIndex]?.name || '照片', timestamp: new Date().toISOString() }
          });
        };
        reader.readAsDataURL(file);
      };
      input.click();
    };
    
    const takeNextPhoto = (stepIndex) => {
      const photos = props.steps[stepIndex].photos || [];
      const required = props.steps[stepIndex].requiredPhotos || [];
      for (let i = 0; i < required.length; i++) { if (!photos[i]) { takePhoto(stepIndex, i); return; } }
    };
    
    const viewPhoto = (stepIndex, photoIndex) => {
      const photos = props.steps[stepIndex].photos || [];
      if (photos[photoIndex]) { viewerPhotoUrl.value = photos[photoIndex].url; viewerPhotoName.value = photos[photoIndex].name; showPhotoViewer.value = true; }
    };
    const closePhotoViewer = () => { showPhotoViewer.value = false; viewerPhotoUrl.value = ''; viewerPhotoName.value = ''; };
    const updateNotes = (stepIndex, notes) => emit('notes-update', { projectId: props.projectId, stepIndex, notes });
    const completeStep = (index) => { if (!canCompleteStep(index)) return; emit('complete', props.projectId, index, { photos: props.steps[index].photos, notes: props.steps[index].notes }); };
    const startRework = (index) => { emit('rework', props.projectId, index); activeIndex.value = index; };
    const formatTime = (isoString) => { const d = new Date(isoString); return d.toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }); };
    
    return { activeIndex, showPhotoViewer, viewerPhotoUrl, viewerPhotoName, completedCount, progressPercent, isStepAccessible, canCompleteStep, getUploadedCount, isPhotoUploaded, getPhotoUrl, toggleStep, takePhoto, takeNextPhoto, viewPhoto, closePhotoViewer, updateNotes, completeStep, startRework, formatTime };
  }
};
</script>
