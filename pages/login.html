<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>聚达勘察助手 - 登录</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { font-family: -apple-system, sans-serif; height: 100%; background: linear-gradient(135deg, #1989fa 0%, #096dd9 100%); }
    .login-container { min-height: 100vh; display: flex; flex-direction: column; padding: 20px; }
    .login-header { text-align: center; padding: 60px 0 40px; }
    .login-logo { width: 80px; height: 80px; margin: 0 auto 16px; background: #fff; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 48px; font-weight: bold; color: #1989fa; box-shadow: 0 4px 16px rgba(0,0,0,0.15); }
    .login-title { font-size: 28px; font-weight: 700; color: #fff; margin-bottom: 8px; }
    .login-subtitle { font-size: 14px; color: rgba(255,255,255,0.8); }
    .login-card { background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 8px 32px rgba(0,0,0,0.15); flex: 1; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 14px; color: #666; margin-bottom: 8px; }
    .form-input { width: 100%; padding: 14px 16px; border: 1px solid #ebedf0; border-radius: 10px; font-size: 16px; background: #fff; outline: none; -webkit-appearance: none; }
    .form-input:focus { border-color: #1989fa; }
    .btn-login { width: 100%; padding: 16px; background: linear-gradient(135deg, #1989fa 0%, #096dd9 100%); color: #fff; border: none; border-radius: 10px; font-size: 17px; font-weight: 600; cursor: pointer; }
    .btn-login:active { opacity: 0.9; }
    .tips-text { font-size: 12px; color: #999; text-align: center; margin-top: 20px; line-height: 1.8; }
    .admin-hint { background: #e6f7ff; border: 1px solid #91d5ff; border-radius: 8px; padding: 12px; margin-bottom: 16px; text-align: center; font-size: 13px; color: #1890ff; }
    #loginMsg { margin-top: 12px; padding: 10px; border-radius: 8px; text-align: center; font-size: 14px; display: none; }
    #loginMsg.success { display: block; background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; }
    #loginMsg.error { display: block; background: #fff2f0; color: #ff4d4f; border: 1px solid #ffccc7; }
    #debugInfo { margin-top: 16px; padding: 10px; background: #f5f5f5; border-radius: 8px; font-size: 11px; color: #666; word-break: break-all; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <div class="login-logo">聚</div>
      <div class="login-title">聚达勘察助手</div>
      <div class="login-subtitle">标准化施工质检管理系统</div>
    </div>
    
    <div class="login-card">
      <div class="form-group">
        <label class="form-label">手机号</label>
        <input type="tel" class="form-input" id="inputPhone" placeholder="请输入手机号" maxlength="11">
      </div>
      
      <div id="passwordSection" style="display:none;">
        <div class="form-group">
          <label class="form-label">密码</label>
          <input type="password" class="form-input" id="inputPassword" placeholder="请输入密码" maxlength="4">
        </div>
        <div class="admin-hint">👔 管理员登录，请输入密码</div>
      </div>
      
      <div id="loginMsg"></div>
      
      <button class="btn-login" id="btnLogin">登录</button>
      
      <div class="tips-text">
        <p>👔 管理员：13800138000 / 密码：1234</p>
        <p>📱 员工账号由管理员创建，无需密码</p>
      </div>
      
      <div id="debugInfo">加载中...</div>
    </div>
  </div>

  <script>
    // ====== 完全内联的登录逻辑，不依赖任何外部JS ======
    
    var KEYS = { USER_INFO: 'juda_user_info', USERS: 'juda_users' };
    var ROLES = { ADMIN: 'admin', SURVEYOR: 'surveyor', WORKER: 'worker', REVIEWER: 'reviewer' };
    
    var debugLog = [];
    function dbg(msg) {
      debugLog.push(msg);
      var el = document.getElementById('debugInfo');
      if (el) el.textContent = debugLog.join(' → ');
    }
    
    function safeGet(key) {
      try { var d = localStorage.getItem(key); return d ? JSON.parse(d) : null; }
      catch(e) { dbg('读取失败:' + e.message); return null; }
    }
    
    function safeSet(key, data) {
      try { localStorage.setItem(key, JSON.stringify(data)); return true; }
      catch(e) { dbg('保存失败:' + e.message); return false; }
    }
    
    function getUsers() { return safeGet(KEYS.USERS) || []; }
    
    function initDefaultAdmin() {
      var users = getUsers();
      if (!users.find(function(u) { return u.role === ROLES.ADMIN; })) {
        users.push({ id: 'admin_001', employeeId: '13800138000', name: '张工', role: ROLES.ADMIN, password: '1234', status: 'active', createTime: new Date().toISOString() });
        safeSet(KEYS.USERS, users);
        dbg('已创建默认管理员');
      }
    }
    
    function doLogin(employeeId, password) {
      dbg('开始登录');
      var users = getUsers();
      dbg('用户数:' + users.length);
      
      var user = null;
      for (var i = 0; i < users.length; i++) {
        if (users[i].employeeId === employeeId) { user = users[i]; break; }
      }
      
      if (!user) { dbg('用户不存在'); return { success: false, message: '用户不存在' }; }
      if (user.status === 'disabled') { return { success: false, message: '账号已被禁用' }; }
      if (user.role === ROLES.ADMIN && user.password !== password) { dbg('密码错误'); return { success: false, message: '密码错误' }; }
      
      // 保存登录状态
      var sessionUser = {};
      for (var k in user) { if (k !== 'password') sessionUser[k] = user[k]; }
      sessionUser.lastLoginTime = new Date().toISOString();
      safeSet(KEYS.USER_INFO, sessionUser);
      
      // 更新用户列表
      for (var i = 0; i < users.length; i++) {
        if (users[i].id === user.id) { users[i].lastLoginTime = sessionUser.lastLoginTime; break; }
      }
      safeSet(KEYS.USERS, users);
      
      dbg('登录成功');
      return { success: true, user: sessionUser };
    }
    
    // ====== 页面初始化 ======
    
    dbg('页面加载');
    initDefaultAdmin();
    dbg('初始化完成');
    
    var isAdminLogin = false;
    
    // 手机号输入检查
    document.getElementById('inputPhone').addEventListener('input', function() {
      var phone = this.value;
      isAdminLogin = false;
      document.getElementById('passwordSection').style.display = 'none';
      document.getElementById('loginMsg').style.display = 'none';
      
      if (phone.length === 11) {
        var users = getUsers();
        var found = null;
        for (var i = 0; i < users.length; i++) {
          if (users[i].employeeId === phone) { found = users[i]; break; }
        }
        if (found && found.role === ROLES.ADMIN) {
          isAdminLogin = true;
          document.getElementById('passwordSection').style.display = 'block';
          dbg('管理员账号');
        } else if (found) {
          dbg('员工账号');
        } else {
          showMsg('账号不存在，请联系管理员', 'error');
        }
      }
    });
    
    // 登录按钮
    document.getElementById('btnLogin').addEventListener('click', function() {
      var phone = document.getElementById('inputPhone').value;
      var password = document.getElementById('inputPassword').value;
      
      dbg('点击登录 phone=' + phone);
      
      if (!phone || phone.length !== 11) {
        showMsg('请输入正确的手机号', 'error');
        return;
      }
      
      if (isAdminLogin && !password) {
        showMsg('请输入密码', 'error');
        return;
      }
      
      try {
        var result = doLogin(phone, password || '');
        if (result.success) {
          showMsg('登录成功！正在跳转...', 'success');
          dbg('跳转主页');
          setTimeout(function() {
            window.location.href = '../index.html';
          }, 1000);
        } else {
          showMsg(result.message, 'error');
        }
      } catch(e) {
        dbg('异常:' + e.message);
        showMsg('登录出错：' + e.message, 'error');
      }
    });
    
    function showMsg(text, type) {
      var el = document.getElementById('loginMsg');
      el.textContent = text;
      el.className = type;
    }
  </script>
</body>
</html>
